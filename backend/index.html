<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pet Analytics Engine v2</title>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d;
            --accent: #58a6ff; --danger: #f85149; --success: #3fb950; --text: #c9d1d9;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { font-weight: 600; color: var(--accent); margin-bottom: 30px; border-bottom: 1px solid var(--border); width: 100%; text-align: center; padding-bottom: 10px; }
        h3 { margin-top: 0; color: #8b949e; font-size: 0.85rem; text-transform: uppercase; }
        .big-num { font-size: 3rem; font-weight: bold; margin: 10px 0; display: block; }
        
        /* Data Groupings */
        .data-section { margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px; }
        details { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; }
        summary { padding: 10px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; }
        summary:hover { background: #21262d; }
        .tab-list { padding: 10px; font-size: 0.9rem; color: #8b949e; }
        .tab-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #21262d; }
        
        .badge { background: var(--danger); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; }
        .success-text { color: var(--success); }
        .danger-text { color: var(--danger); }
    </style>
</head>
<body>

    <h1>PET ANALYTICS ENGINE</h1>

    <div class="grid">
        <div class="card">
            <h3>Total Affection</h3>
            <span class="big-num success-text" id="affection">0</span>
            
            <div class="data-section">
                <h3>Happiness Sources (Count: <span id="happy-total">0</span>)</h3>
                <div id="happy-list"></div>
            </div>
        </div>

        <div class="card">
            <h3>Total Anger Events</h3>
            <span class="big-num danger-text" id="anger">0</span>
            
            <div class="data-section">
                <h3>Active Distractions (Expand for details)</h3>
                <div id="anger-list"></div>
            </div>
        </div>
    </div>

    <script>
        // Keep track of which platforms are currently expanded
    let openState = {};

    async function fetchData() {
        try {
            const res = await fetch('http://127.0.0.1:8000/');
            const data = await res.json();

            // Update Totals
            document.getElementById('affection').innerText = data.total_affection_points;
            document.getElementById('anger').innerText = data.total_anger_count;
            document.getElementById('happy-total').innerText = data.total_happiness_count;

            // Happiness List
            const happyList = document.getElementById('happy-list');
            happyList.innerHTML = Object.entries(data.source_of_happiness)
                .map(([cause, count]) => `<div class="tab-item"><span>${cause}</span><span class="success-text">x${count}</span></div>`)
                .join('') || "<p>No joy detected yet...</p>";

            // Anger List (Dropdowns)
            const angerList = document.getElementById('anger-list');
            const sources = data.source_of_anger;

            if (Object.keys(sources).length === 0) {
                angerList.innerHTML = "<p>Clean slate. No distractions found.</p>";
                return;
            }

            // Build HTML for each platform
            let newHtml = "";
            for (const platform in sources) {
                const info = sources[platform];
                const isPet = platform === "Desktop Pet";
                const badgeVal = isPet ? `${info["Excessive taps"]} Taps` : `${info["Total seconds"]}s`;
                
                // Check if this platform was already open in the UI
                const isOpen = openState[platform] ? "open" : "";

                newHtml += `
                    <details id="details-${platform}" ${isOpen} ontoggle="saveState('${platform}', this.open)">
                        <summary>
                            <span>${platform}</span>
                            <span class="badge">${badgeVal}</span>
                        </summary>
                        <div class="tab-list">
                            ${!isPet && info.tabs ? Object.entries(info.tabs).map(([tab, time]) => `
                                <div class="tab-item">
                                    <span>${tab.length > 40 ? tab.substring(0, 37) + '...' : tab}</span>
                                    <span>${time}s</span>
                                </div>
                            `).join('') : '<div class="tab-item">Interaction trigger.</div>'}
                        </div>
                    </details>
                `;
            }
            
            // Only update if the data has actually changed to prevent flickering
            if (angerList.innerHTML !== newHtml) {
                angerList.innerHTML = newHtml;
            }
            
        } catch (err) { console.error("API Connection Failed", err); }
    }

    // Helper to remember which dropdowns the user clicked
    function saveState(platform, isOpen) {
        openState[platform] = isOpen;
    }

    setInterval(fetchData, 1000);
    fetchData();
    </script>
</body>
</html>
