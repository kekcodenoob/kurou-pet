[project]
name = "backend"
version = "0.1.0"
description = "Kurou Pet: a Windows desktop pet that rewards focused work and webcam-tracked exercise, with a FastAPI stats server for the React dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.13.0.92",
    "numpy>=2.4.3",
    "fastapi[standard]>=0.136.1",
    "pyautogui>=0.9.54",
    "pyqt5>=5.15.11",
    "mediapipe",
    "pywinctl>=0.4.1",
]

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
